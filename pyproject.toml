[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jibun-kit"
version = "0.1.0"
description = "Ingest your own digital footprint and generate one dual-readable self-understanding markdown (jibun.md)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT AND CC-BY-SA-4.0" }
authors = [{ name = "akihidem" }]
keywords = ["self-understanding", "journaling", "personal-data", "markdown", "ingest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
# Web ingest (twilog, blog). Core install stays stdlib-only.
fetch = ["requests>=2.31", "beautifulsoup4>=4.12", "trafilatura>=1.8"]
test = ["pytest>=8.0"]

[project.scripts]
jibun = "jibun_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jibun_kit = ["templates/*", "prompts/*"]
"jibun_kit.app" = ["*.html"]
